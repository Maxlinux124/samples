<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Different Highlighted Gradient Buttons</title>
    <style>
        /* Basic Setup for alignment */
        body {
            background-color: #0f172a; /* Dark background taaki glow sahi se dikhe */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            min-height: 100vh;
            margin: 0;
        }

        /* Common Button Base Styles */
        .btn {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            position: relative;
        }

        /* -------------------------------------------------------------
           BUTTON 1: The Cosmic Pulse (Fluid Gradient + Pulse Glow)
        ------------------------------------------------------------- */
        .btn-cosmic {
            border-radius: 8px;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: 
                fluidBg 3s linear infinite, 
                cosmicGlow 2s ease-in-out infinite;
        }
        @keyframes cosmicGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 127, 0.5), inset 0 0 5px rgba(255,255,255,0.2); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(127, 0, 255, 0.9), inset 0 0 10px rgba(255,255,255,0.4); transform: scale(1.04); }
        }

        /* -------------------------------------------------------------
           BUTTON 2: Neon Cyberpunk (Fast Spin + Shaking Text)
        ------------------------------------------------------------- */
        .btn-cyber {
            border-radius: 50px;
            background: linear-gradient(90deg, #00f0ff, #00ff87, #00f0ff);
            background-size: 200% auto;
            color: #000; /* Dark text for contrast */
            animation: 
                fluidBg 2s linear infinite;
        }
        .btn-cyber:hover {
            animation: fluidBg 1s linear infinite;
            box-shadow: 0 0 30px #00f0ff;
        }

        /* -------------------------------------------------------------
           BUTTON 3: Lava Flow (Vertical Slow Flow + Infinite Stretch)
        ------------------------------------------------------------- */
        .btn-lava {
            border-radius: 4px;
            background: linear-gradient(180deg, #ff4e50, #f9d423, #ff4e50);
            background-size: 100% 200%;
            animation: 
                verticalBg 4s linear infinite, 
                lavaStretch 3s ease-in-out infinite;
        }
        @keyframes verticalBg {
            0% { background-position: 50% 0%; }
            100% { background-position: 50% 200%; }
        }
        @keyframes lavaStretch {
            0%, 100% { letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 78, 80, 0.4); }
            50% { letter-spacing: 3px; box-shadow: 0 8px 30px rgba(249, 212, 35, 0.8); }
        }

        /* -------------------------------------------------------------
           BUTTON 4: Royal Aurora (Diagonal Flow + Breathing Scale)
        ------------------------------------------------------------- */
        .btn-aurora {
            border-radius: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #00c6ff);
            background-size: 200% 200%;
            animation: 
                fluidBg 4s ease infinite, 
                breath 2.5s ease-in-out infinite;
        }
        @keyframes breath {
            0%, 100% { transform: translateY(0); box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3); }
            50% { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0, 198, 255, 0.7); }
        }

        /* -------------------------------------------------------------
           BUTTON 5: Sunset Electric (Border Highlight Magic)
        ------------------------------------------------------------- */
        .btn-electric {
            border-radius: 30px;
            background: linear-gradient(270deg, #f857a6, #ff5858, #f857a6);
            background-size: 200% auto;
            animation: fluidBg 3s linear infinite;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .btn-electric:hover {
            border-color: #ffffff;
            box-shadow: 0 0 20px #f857a6, inset 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* SHARED UTILITY KEYFRAME (For rotating/moving horizontal gradients) */
        @keyframes fluidBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hover behavior to pause or amplify */
        .btn:hover {
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <button class="btn btn-cosmic">Cosmic Pulse</button>
    
    <button class="btn btn-cyber">Cyber Neon</button>
    
    <button class="btn btn-lava">Lava Flow</button>
    
    <button class="btn btn-aurora">Royal Aurora</button>
    
    <button class="btn btn-electric">Sunset Electric</button>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Rotating Gradient Button</title>
    <style>
        /* Dark luxury background */
        body {
            background-color: #0b0f19; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* 1. CSS Engine ko bataya ki angle ek number (degree) hai */
        @property --gradient-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* 2. Button Styling */
        .smooth-gradient-btn {
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            position: relative;
            z-index: 1;
            
            /* Pure Conic Gradient applied using the custom angle variable */
            background: conic-gradient(from var(--gradient-angle), #ff007f, #7f00ff, #00f0ff, #ff007f);
            
            /* Ultra-smooth infinite rotation (No scale, no blink) */
            animation: spinGradient 6s linear infinite;
        }

        /* 3. Smooth continuous 360-degree rotation keyframe */
        @keyframes spinGradient {
            0% {
                --gradient-angle: 0deg;
            }
            100% {
                --gradient-angle: 360deg;
            }
        }

        /* Subtle smooth glow behind the button (Optional, strictly background only) */
        .smooth-gradient-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: inherit;
            border-radius: inherit;
            filter: blur(15px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .smooth-gradient-btn:hover::before {
            opacity: 0.9; /* Hover karne par background glow halka sa deep hoga */
        }
    </style>
</head>
<body>

    <button class="smooth-gradient-btn">PREMIUM SMOOTH</button>

</body>
</html>




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corner to Corner Smooth Gradient</title>
    <style>
        /* Dark luxury background for contrast */
        body {
            background-color: #0b0f19; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .corner-gradient-btn {
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            
            /* 1. Diagonal Gradient at 45 degrees */
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00f0ff, #ff007f);
            
            /* 2. Background size ko diagonal movement ke liye bada kiya */
            background-size: 300% 300%;
            
            /* 3. Ultra-smooth alternate animation (Kona-to-Kona) */
            animation: cornerSlide 5s ease-in-out infinite alternate;
        }

        /* 4. Keyframes: Ek kone se dusre kone tak smooth flow */
        @keyframes cornerSlide {
            0% {
                background-position: 0% 0%; /* Top-Left / Pehla Kona */
            }
            100% {
                background-position: 100% 100%; /* Bottom-Right / Dusra Kona */
            }
        }

        /* Pure background smooth depth effect on hover */
        .corner-gradient-btn:hover {
            filter: brightness(1.15);
            transition: filter 0.3s ease;
        }
    </style>
</head>
<body>

    <button class="corner-gradient-btn">SMOOTH FLOW</button>

</body>
</html>
